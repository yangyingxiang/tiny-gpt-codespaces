name: tests

# `main` is intentionally broken (it is the exercise), so CI runs on the
# `solutions` branch, where every test should pass. Run it by hand on any
# branch with "Run workflow".
on:
  push:
    branches: [solutions]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Smoke-test training end to end
        run: |
          python -m sft.train --max_iters 60 --eval_interval 30 --eval_examples 20 \
            --final_eval_examples 20 --log_interval 20
